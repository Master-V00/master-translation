[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--prefer-offline"
  SECRETS_SCAN_ENABLED = "false"
  
[build.processing]
  skip_processing = true

[build.processing.secrets_scanning]
  enabled = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200